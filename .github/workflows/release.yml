name: Build apps

# 推送 v* 标签（如 v1.0.0）时构建并发布；也可在 Actions 页面手动运行
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 安装资源编译工具（给 exe 嵌入图标）
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: 构建 Windows / macOS 应用
        run: python packaging/build.py --verify-linux
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: dist/*

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - name: 启动 exe 并检查服务
        shell: pwsh
        run: |
          Start-Process -FilePath .\QSB-Studio-Windows-x64.exe
          $state = Join-Path $env:LOCALAPPDATA "QSB Studio\server.json"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $state); $i++) { Start-Sleep -Seconds 1 }
          $port = (Get-Content $state | ConvertFrom-Json).port
          $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
          if ($h.modules -ne 19) { throw "health check failed" }
          $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/solve/maxflow" -ContentType "application/json" -Body '{"edges":"0 1 3\n1 2 2","source":0,"sink":2}'
          if ($r.status -ne "optimal") { throw "solve failed" }
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/quit"
          Get-Content (Join-Path $env:LOCALAPPDATA "QSB Studio\qsb-studio.log")

  smoke-macos:
    needs: build
    strategy:
      matrix:
        os: [macos-14, macos-13]   # Apple 芯片 / Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - name: 启动 .app 并检查服务
        run: |
          ditto -x -k QSB-Studio-macOS.zip .
          "QSB Studio.app/Contents/MacOS/QSBStudio" &
          STATE="$HOME/Library/Application Support/QSB Studio/server.json"
          for i in $(seq 60); do [ -f "$STATE" ] && break; sleep 1; done
          PORT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['port'])" "$STATE")
          curl -sf "http://127.0.0.1:$PORT/api/health" | grep -q '"modules": 19'
          curl -sf -X POST "http://127.0.0.1:$PORT/api/solve/maxflow" -d '{"edges":"0 1 3\n1 2 2","source":0,"sink":2}' | grep -q optimal
          curl -sf -X POST "http://127.0.0.1:$PORT/api/quit"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke-windows, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            QSB-Studio-Windows-x64.exe
            QSB-Studio-macOS.zip
