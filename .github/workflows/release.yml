name: Build apps

# Pull Request 时构建并在真实 Windows / Mac 上冒烟测试；推送 v* 标签（如 v1.0.0）时额外发布到 Releases
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 安装资源编译工具（给 exe 嵌入图标）
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: 构建 Windows / macOS 应用
        run: python packaging/build.py --verify-linux
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: dist/*

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - name: 启动 exe，检查原生窗口、页面加载与求解
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "QSB Studio\qsb-studio.log"
          $p = Start-Process -FilePath .\QSB-Studio-Windows-x64.exe -PassThru
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "页面已连接" -Quiet)) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "WebView2 原生窗口已创建" -Quiet)) { throw "没有创建 WebView2 原生窗口" }
          if (-not (Select-String -Path $log -Pattern "页面已连接" -Quiet)) { throw "窗口中的页面没有加载" }
          $port = [regex]::Match((Get-Content $log -Raw), "嵌入模式）：http://127.0.0.1:(\d+)").Groups[1].Value
          $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
          if ($h.modules -ne 19) { throw "health check failed" }
          $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/solve/maxflow" -ContentType "application/json" -Body '{"edges":"0 1 3\n1 2 2","source":0,"sink":2}'
          if ($r.status -ne "optimal") { throw "solve failed" }
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 2
          if (Get-Process pythonw -ErrorAction SilentlyContinue) { throw "关闭窗口后后台服务没有退出" }

  smoke-macos:
    needs: build
    strategy:
      matrix:
        os: [macos-14, macos-13]   # Apple 芯片 / Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - name: 启动 .app，检查原生窗口、页面加载与求解
        run: |
          ditto -x -k QSB-Studio-macOS.zip .
          open "QSB Studio.app"
          LOG="$HOME/Library/Application Support/QSB Studio/qsb-studio.log"
          for i in $(seq 90); do grep -q "页面已连接" "$LOG" 2>/dev/null && break; sleep 1; done
          cat "$LOG"
          grep -q "原生窗口已打开" "$LOG" || { echo "::error::没有打开原生窗口（回退到了浏览器）"; exit 1; }
          grep -q "页面已连接" "$LOG" || { echo "::error::窗口中的页面没有加载"; exit 1; }
          PORT=$(grep -o "原生窗口）：http://127.0.0.1:[0-9]*" "$LOG" | grep -o "[0-9]*$" | head -1)
          curl -sf "http://127.0.0.1:$PORT/api/health" | grep -q '"modules": 19'
          curl -sf -X POST "http://127.0.0.1:$PORT/api/solve/maxflow" -d '{"edges":"0 1 3\n1 2 2","source":0,"sink":2}' | grep -q optimal
          curl -sf -X POST "http://127.0.0.1:$PORT/api/quit"
          sleep 3
          ! curl -s -m 2 "http://127.0.0.1:$PORT/api/health"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke-windows, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            QSB-Studio-Windows-x64.exe
            QSB-Studio-macOS.zip
