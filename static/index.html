<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* 提前设主题，避免首屏闪烁 */(function(){try{var t=localStorage.getItem('qsb-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>QSB Studio — 运筹学教学工作台</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="/icon.svg" alt="" width="30" height="30">QSB<span>Studio</span></div>
    <div class="brand-sub">运筹学教学工作台 · 19 个模块</div>
    <nav id="module-nav" class="nav" aria-label="模块"></nav>
    <div class="side-actions">
      <button id="theme-btn" class="btn small ghost" type="button">🌙 深色主题</button>
      <button id="quit-btn" class="btn small ghost hidden" type="button">⏻ 退出程序</button>
    </div>
    <div class="sidebar-foot">独立实现 · 受 WinQSB 启发 · <span id="version"></span></div>
  </aside>

  <main class="main">
    <button id="menu-btn" class="btn small ghost menu-btn" type="button">☰ 模块</button>

    <!-- 线性规划 -->
    <section id="view-lp" class="view">
      <header class="view-head">
        <h1>📊 线性规划 <span class="en">Linear Programming</span></h1>
        <p class="desc">填好模型后点击求解：逐步观看单纯形枢轴、2 变量图解中的顶点路径，以及影子价格与灵敏度分析。</p>
      </header>
      <div id="lp-explain" class="explain-panel hidden"></div>
      <div class="panel">
        <div class="form-row">
          <label class="f"><span>目标</span>
            <select id="lp-obj"><option value="max">最大化 max</option><option value="min">最小化 min</option></select>
          </label>
          <label class="f"><span>变量数</span><input type="number" id="lp-nvar" value="2" min="1" max="40"></label>
          <label class="f"><span>约束数</span><input type="number" id="lp-ncon" value="3" min="1" max="120"></label>
          <label class="f"><span>示例</span><select id="lp-examples"></select></label>
          <div class="spacer"></div>
          <button id="lp-solve" class="btn primary" type="button">▶ 求解并演示</button>
        </div>
        <p class="model-legend">
          <b>首行是目标函数</b>，下面<b>每行是一个约束</b>：Σ 系数·变量 （≤ / ≥ / =） 右端 b。
          列头 x₁…xₙ 下的数是该变量在这一行的系数。所有变量默认 ≥ 0。
        </p>
        <div id="lp-model" class="model"></div>
      </div>
      <div id="lp-result" class="result hidden"></div>
    </section>

    <!-- 通用模块 -->
    <section id="view-generic" class="view hidden">
      <header class="view-head">
        <h1 id="gen-title"></h1>
        <p class="desc" id="gen-desc"></p>
      </header>
      <div id="gen-explain" class="explain-panel hidden"></div>
      <div class="panel">
        <div id="gen-form" class="gen-form"></div>
        <div class="form-actions">
          <button id="gen-solve" class="btn primary" type="button">▶ 求解并演示</button>
          <button id="gen-reset" class="btn ghost" type="button">恢复示例数据</button>
        </div>
      </div>
      <div id="gen-result" class="result hidden"></div>
    </section>

    <!-- 不可用模块 -->
    <section id="view-stub" class="view hidden">
      <header class="view-head"><h1 id="stub-title"></h1><p class="desc" id="stub-desc"></p></header>
      <div class="panel placeholder-panel">
        <div class="ph-icon">⚠️</div>
        <div class="ph-title">该模块未能加载</div>
        <div class="ph-sub">请查看服务端日志了解原因。</div>
        <button id="stub-back" class="btn ghost" type="button">← 返回线性规划</button>
      </div>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
