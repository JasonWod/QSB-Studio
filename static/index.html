<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* 提前设主题与显示大小，避免首屏闪烁 */(function(){try{var d=document.documentElement,t=localStorage.getItem('qsb-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.setAttribute('data-theme',t);var z=+localStorage.getItem('qsb-zoom');if(z)d.style.zoom=z;}catch(e){}})();</script>
<title>QSB Studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="/icon.svg" alt=""><b>QSB Studio</b></div>
    <label class="search"><input id="search" type="search" placeholder="搜索模块" autocomplete="off" aria-label="搜索模块"><kbd id="search-key">Ctrl K</kbd></label>
    <nav id="module-nav" class="nav" aria-label="模块"></nav>
    <div class="side-foot">
      <div class="zoom" title="显示大小（投影时可放大）"><span>显示</span><button id="zoom-out" type="button" aria-label="缩小">−</button><span id="zoom-val">100%</span><button id="zoom-in" type="button" aria-label="放大">+</button></div>
      <button id="theme-btn" class="side-btn" type="button"><span class="ico">◐</span><span id="theme-label">黑板主题</span></button>
      <button id="help-btn" class="side-btn" type="button"><span class="ico">⌨</span><span>快捷键</span></button>
      <button id="collapse-btn" class="side-btn" type="button"><span class="ico">⇤</span><span>收起侧栏</span></button>
      <button id="quit-btn" class="side-btn hidden" type="button"><span class="ico">⏻</span><span>退出程序</span></button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <section class="work">
    <header class="topbar">
      <button id="menu-btn" class="btn icon menu-btn" type="button" aria-label="打开模块列表">☰</button>
      <div class="title"><h1 id="mod-title"></h1><span class="en" id="mod-en"></span></div>
      <div class="actions">
        <button id="reset-btn" class="btn" type="button" title="把输入恢复为示例数据">恢复示例</button>
        <button id="present-btn" class="btn" type="button" title="隐藏输入区，只显示演示（F）">演示全屏</button>
        <button id="solve-btn" class="btn primary" type="button">求解 <span class="key" id="solve-key">Ctrl ↵</span></button>
      </div>
    </header>
    <div class="panes">
      <div class="inputs" id="inputs"></div>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="拖动调整输入区宽度" tabindex="0"></div>
      <main class="stage" id="stage"><div class="stage-inner" id="stage-inner"></div></main>
    </div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
